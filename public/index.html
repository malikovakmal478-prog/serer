<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<meta
  name="description"
  content="NOVAIX — Premium digital platform"
/>

<meta
  name="theme-color"
  content="#050507"
/>

<title>NOVAIX</title>

<style>

@import url(
  'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap'
);

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050507;
  --panel:#0d0d12;
  --panel2:#111118;
  --text:#f8f8fc;
  --muted:#8e8e9d;
  --line:rgba(255,255,255,.08);
  --purple:#8d7cff;
  --purple2:#b7adff;
  --green:#65e6a0;
  --red:#ff707d;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 50% -20%,
      rgba(113,88,255,.22),
      transparent 38%
    ),
    var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

.hidden{
  display:none!important;
}

/* =====================================================
   LOADER
===================================================== */

#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:grid;
  place-items:center;
  background:#050507;
  transition:.5s;
}

.loader-box{
  text-align:center;
}

.loader-logo{
  width:65px;
  height:65px;
  display:grid;
  place-items:center;
  margin:auto;
  border-radius:20px;
  background:
    linear-gradient(
      135deg,
      #fff,
      #9387ff
    );
  color:#08080a;
  font-size:25px;
  font-weight:900;
  box-shadow:
    0 0 70px rgba(130,110,255,.35);
}

.loader-box p{
  margin-top:18px;
  color:#777784;
  font-size:12px;
  letter-spacing:.18em;
}

/* =====================================================
   NAV
===================================================== */

.nav{
  position:sticky;
  top:0;
  z-index:100;
  height:76px;
  border-bottom:1px solid rgba(255,255,255,.055);
  background:rgba(5,5,7,.72);
  backdrop-filter:blur(25px);
}

.nav-inner{
  width:min(1180px,calc(100% - 32px));
  height:100%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
  font-weight:800;
  letter-spacing:-.05em;
}

.logo-mark{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  border-radius:11px;
  color:#08080a;
  background:
    linear-gradient(
      135deg,
      white,
      #9488ff
    );
}

.nav-links{
  display:flex;
  align-items:center;
  gap:8px;
}

.nav-links button,
.nav-links a{
  border:0;
  background:transparent;
  color:#a2a2ae;
  padding:10px 13px;
  border-radius:10px;
  transition:.2s;
}

.nav-links button:hover,
.nav-links a:hover{
  color:white;
  background:rgba(255,255,255,.05);
}

.nav-primary{
  color:#070709!important;
  background:
    linear-gradient(
      135deg,
      #fff,
      #afa6ff
    )!important;
  font-weight:700;
}

/* =====================================================
   PAGE
===================================================== */

.page{
  min-height:calc(100vh - 76px);
}

.container{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
}

/* =====================================================
   HERO
===================================================== */

.hero{
  min-height:720px;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:70px;
  position:relative;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  right:-150px;
  top:100px;
  background:rgba(106,80,255,.16);
  filter:blur(120px);
  border-radius:50%;
  pointer-events:none;
}

.hero-copy{
  position:relative;
  z-index:2;
}

.badge{
  width:max-content;
  padding:8px 13px;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.035);
  border-radius:100px;
  color:#bbb4ff;
  font-size:10px;
  font-weight:800;
  letter-spacing:.14em;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#72efaa;
  box-shadow:0 0 15px #72efaa;
}

.hero h1{
  margin-top:27px;
  font-size:clamp(52px,7vw,91px);
  line-height:.95;
  letter-spacing:-.075em;
}

.gradient-text{
  display:block;
  color:transparent;
  background:
    linear-gradient(
      100deg,
      #fff 0%,
      #aaa1ff 55%,
      #fff 100%
    );
  background-clip:text;
  -webkit-background-clip:text;
}

.hero-description{
  max-width:590px;
  margin-top:27px;
  color:#91919f;
  font-size:17px;
  line-height:1.8;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:34px;
}

.btn{
  border:0;
  border-radius:13px;
  padding:14px 20px;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  transition:.2s;
}

.btn-primary{
  color:#070709;
  background:
    linear-gradient(
      135deg,
      #fff,
      #afa6ff
    );
  font-weight:800;
  box-shadow:
    0 15px 40px rgba(120,100,255,.18);
}

.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:
    0 22px 50px rgba(120,100,255,.3);
}

.btn-secondary{
  color:white;
  border:1px solid var(--line);
  background:rgba(255,255,255,.035);
}

.btn-secondary:hover{
  background:rgba(255,255,255,.07);
}

.hero-window{
  position:relative;
  border:1px solid rgba(255,255,255,.1);
  border-radius:24px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.015)
    );
  box-shadow:
    0 40px 120px rgba(0,0,0,.6);
  overflow:hidden;
  transform:rotate(1deg);
}

.window-top{
  height:48px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 17px;
  border-bottom:1px solid var(--line);
  background:#101015;
}

.window-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#474751;
}

.window-content{
  min-height:390px;
  padding:35px;
  font-family:monospace;
  color:#9999a7;
  line-height:2;
}

.code-purple{
  color:#a89fff;
}

.code-white{
  color:#efeff4;
}

.code-green{
  color:#71e8a5;
}

.code-number{
  color:#494954;
  margin-right:22px;
}

.code-indent{
  padding-left:42px;
}

/* =====================================================
   FEATURES
===================================================== */

.features{
  padding:40px 0 100px;
}

.section-title{
  text-align:center;
  margin-bottom:40px;
}

.section-title span{
  color:#a79fff;
  font-size:11px;
  font-weight:800;
  letter-spacing:.16em;
}

.section-title h2{
  margin-top:12px;
  font-size:38px;
  letter-spacing:-.055em;
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.feature{
  padding:30px;
  border:1px solid var(--line);
  border-radius:20px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.015)
    );
  transition:.25s;
}

.feature:hover{
  transform:translateY(-5px);
  border-color:rgba(168,158,255,.22);
}

.feature-icon{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:rgba(141,124,255,.12);
  color:#aaa1ff;
  font-size:19px;
}

.feature h3{
  margin-top:22px;
  font-size:18px;
}

.feature p{
  margin-top:9px;
  color:#82828f;
  line-height:1.7;
  font-size:14px;
}

/* =====================================================
   AUTH
===================================================== */

.auth-page{
  min-height:calc(100vh - 76px);
  display:grid;
  place-items:center;
  padding:70px 16px;
}

.auth-card{
  width:min(440px,100%);
  padding:38px;
  border:1px solid var(--line);
  border-radius:24px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.02)
    );
  box-shadow:
    0 40px 100px rgba(0,0,0,.45);
}

.auth-symbol{
  width:47px;
  height:47px;
  display:grid;
  place-items:center;
  border-radius:14px;
  color:#070709;
  background:
    linear-gradient(
      135deg,
      #fff,
      #aaa0ff
    );
}

.auth-card h1{
  margin-top:23px;
  font-size:31px;
  letter-spacing:-.055em;
}

.auth-card > p{
  margin-top:9px;
  color:#888894;
  font-size:14px;
}

.form{
  margin-top:27px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#c8c8d1;
  font-size:12px;
  font-weight:700;
}

.field input,
.field textarea{
  width:100%;
  padding:14px 15px;
  color:white;
  background:rgba(0,0,0,.25);
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:#8f82ff;
  box-shadow:
    0 0 0 4px rgba(141,124,255,.08);
}

.form .btn{
  width:100%;
  margin-top:5px;
}

.form-message{
  padding:12px 14px;
  margin-bottom:15px;
  border-radius:11px;
  font-size:13px;
}

.error{
  color:#ffadb5;
  background:rgba(255,70,90,.07);
  border:1px solid rgba(255,70,90,.15);
}

.success{
  color:#8ff0ba;
  background:rgba(50,220,130,.07);
  border:1px solid rgba(50,220,130,.15);
}

.switch{
  text-align:center;
  margin-top:20px;
  color:#777783;
  font-size:13px;
}

.switch a{
  color:#aaa1ff;
}

/* =====================================================
   DASHBOARD
===================================================== */

.dashboard{
  padding:65px 0 100px;
}

.dashboard-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
}

.dashboard-label{
  color:#a89fff;
  font-size:10px;
  font-weight:900;
  letter-spacing:.17em;
}

.dashboard-head h1{
  margin-top:10px;
  font-size:clamp(38px,5vw,66px);
  letter-spacing:-.07em;
}

.dashboard-head p{
  margin-top:8px;
  color:#858592;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-top:42px;
}

.stat{
  padding:23px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.025);
}

.stat-label{
  color:#747480;
  font-size:10px;
  font-weight:800;
  letter-spacing:.12em;
}

.stat-value{
  margin-top:10px;
  font-size:24px;
  font-weight:800;
}

.panel{
  margin-top:15px;
  padding:28px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(255,255,255,.025);
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:23px;
}

.panel-head h2{
  font-size:18px;
}

.panel-head span{
  color:#73737f;
  font-size:12px;
}

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.account-line{
  padding:17px;
  border:1px solid var(--line);
  border-radius:13px;
  background:rgba(0,0,0,.15);
}

.account-line small{
  color:#70707c;
  font-size:10px;
  font-weight:800;
  letter-spacing:.1em;
}

.account-line strong{
  display:block;
  margin-top:7px;
  font-size:14px;
  word-break:break-word;
}

.admin-panel{
  margin-top:15px;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:14px 10px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:12px;
  white-space:nowrap;
}

th{
  color:#73737f;
  font-size:10px;
  letter-spacing:.1em;
}

.user-pill{
  display:inline-flex;
  padding:6px 9px;
  border-radius:99px;
  background:rgba(255,255,255,.06);
  color:#b9b3ff;
  font-size:10px;
  font-weight:800;
}

.small-btn{
  padding:7px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.04);
  color:#dddde5;
  font-size:11px;
}

.small-btn:hover{
  background:rgba(255,255,255,.08);
}

.notification{
  padding:14px;
  margin-bottom:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.025);
}

.notification.unread{
  border-color:rgba(141,124,255,.3);
}

.notification strong{
  font-size:13px;
}

.notification p{
  margin-top:5px;
  color:#80808c;
  font-size:12px;
  line-height:1.5;
}

/* =====================================================
   FOOTER
===================================================== */

footer{
  border-top:1px solid var(--line);
  padding:30px 0;
  color:#656570;
  font-size:12px;
}

.footer-inner{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:20px;
}

/* =====================================================
   TOAST
===================================================== */

#toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:9998;
  max-width:350px;
  padding:14px 17px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#111116;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  color:white;
  font-size:13px;
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

#toast.show{
  transform:translateY(0);
  opacity:1;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px){

  .hero{
    grid-template-columns:1fr;
    min-height:auto;
    padding:70px 0 60px;
  }

  .hero-window{
    transform:none;
  }

  .feature-grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .dashboard-head{
    align-items:flex-start;
    flex-direction:column;
  }

}

@media(max-width:560px){

  .nav-links a:not(.nav-primary),
  .nav-links button:not(.nav-primary){
    display:none;
  }

  .hero h1{
    font-size:54px;
  }

  .actions{
    flex-direction:column;
  }

  .actions .btn{
    width:100%;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .profile-grid{
    grid-template-columns:1fr;
  }

  .auth-card{
    padding:27px;
  }

  .window-content{
    padding:24px 17px;
    font-size:11px;
  }

  .footer-inner{
    flex-direction:column;
  }

}

</style>

</head>

<body>

<!-- =====================================================
     LOADER
===================================================== -->

<div id="loader">

  <div class="loader-box">

    <div class="loader-logo">
      N
    </div>

    <p>NOVAIX</p>

  </div>

</div>

<!-- =====================================================
     NAVIGATION
===================================================== -->

<header class="nav">

  <div class="nav-inner">

    <a
      href="#"
      class="logo"
      onclick="goHome();return false;"
    >

      <span class="logo-mark">
        N
      </span>

      NOVAIX

    </a>

    <nav
      class="nav-links"
      id="navLinks"
    >

      <a
        href="#"
        onclick="goHome();return false;"
      >
        Home
      </a>

      <button
        id="navDashboard"
        class="hidden"
        onclick="showDashboard()"
      >
        Dashboard
      </button>

      <button
        id="navAdmin"
        class="hidden"
        onclick="showDashboard()"
      >
        Admin
      </button>

      <a
        href="#"
        id="navLogin"
        onclick="showLogin();return false;"
      >
        Login
      </a>

      <a
        href="#"
        id="navRegister"
        class="nav-primary"
        onclick="showRegister();return false;"
      >
        Get Started
      </a>

      <button
        id="navLogout"
        class="hidden"
        onclick="logout()"
      >
        Logout
      </button>

    </nav>

  </div>

</header>

<!-- =====================================================
     MAIN
===================================================== -->

<main id="app"></main>

<!-- =====================================================
     TOAST
===================================================== -->

<div id="toast"></div>

<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

  <div class="footer-inner">

    <span>
      © <span id="year"></span> NOVAIX
    </span>

    <span>
      Built for the next generation.
    </span>

  </div>

</footer>

<script>

/* =====================================================
   GLOBAL
===================================================== */

const state = {
  user: null,
  stats: null,
  users: [],
  notifications: []
};

const API = "";

const app = document.getElementById("app");

document.getElementById("year").textContent =
  new Date().getFullYear();

/* =====================================================
   STORAGE
===================================================== */

function getToken(){

  return localStorage.getItem(
    "novaix_token"
  );

}

function getStoredUser(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "novaix_user"
      )
    );

  }catch{

    return null;

  }

}

function saveAuth(data){

  localStorage.setItem(
    "novaix_token",
    data.token
  );

  localStorage.setItem(
    "novaix_user",
    JSON.stringify(data.user)
  );

  state.user = data.user;

  updateNavigation();

}

function clearAuth(){

  localStorage.removeItem(
    "novaix_token"
  );

  localStorage.removeItem(
    "novaix_user"
  );

  state.user = null;

  updateNavigation();

}

/* =====================================================
   API
===================================================== */

async function api(
  url,
  options = {}
){

  const headers = {
    ...(options.body
      ? {
          "Content-Type":
            "application/json"
        }
      : {}),
    ...(options.headers || {})
  };

  const token = getToken();

  if(token){

    headers.Authorization =
      `Bearer ${token}`;

  }

  const response =
    await fetch(
      API + url,
      {
        ...options,
        headers
      }
    );

  let data;

  try{

    data = await response.json();

  }catch{

    data = {
      success:false,
      message:
        "Invalid server response."
    };

  }

  if(
    response.status === 401 &&
    url !== "/api/auth/login" &&
    url !== "/api/auth/register"
  ){

    clearAuth();

  }

  if(!response.ok){

    throw new Error(
      data.message ||
      "Request failed."
    );

  }

  return data;

}

/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function toast(
  message,
  type = "normal"
){

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent =
    message;

  element.style.borderColor =
    type === "error"
      ? "rgba(255,80,100,.3)"
      : type === "success"
      ? "rgba(70,230,140,.3)"
      : "rgba(255,255,255,.1)";

  element.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      () => {
        element.classList.remove(
          "show"
        );
      },
      3200
    );

}

/* =====================================================
   NAVIGATION
===================================================== */

function updateNavigation(){

  const logged =
    !!getToken();

  document
    .getElementById(
      "navLogin"
    )
    .classList.toggle(
      "hidden",
      logged
    );

  document
    .getElementById(
      "navRegister"
    )
    .classList.toggle(
      "hidden",
      logged
    );

  document
    .getElementById(
      "navDashboard"
    )
    .classList.toggle(
      "hidden",
      !logged
    );

  document
    .getElementById(
      "navLogout"
    )
    .classList.toggle(
      "hidden",
      !logged
    );

  document
    .getElementById(
      "navAdmin"
    )
    .classList.toggle(
      "hidden",
      !(logged &&
        state.user?.role === "admin")
    );

}

/* =====================================================
   HOME
===================================================== */

function goHome(){

  renderHome();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function renderHome(){

  app.innerHTML = `

          item.message

        !item.read
          ? `

              class="small-btn"

                  '${item.id}'
                )

              Mark as read
            </button>

          : ""
      }

    </div>

  `;

}

/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHtml(
  value
){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeAttribute(
  value
){

  return escapeHtml(value)
    .replaceAll("\n","")
    .replaceAll("\r","");

}

function formatDate(
  value
){

  if(!value){

    return "—";

  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "—";

  }

  return date.toLocaleDateString(
    undefined,
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  );

}

===================================================== */

async function initialize(){

  const stored =
    getStoredUser();

  if(stored){

    state.user =
      stored;

  }

  updateNavigation();

  if(getToken()){

    try{

      const me =
        await api(
          "/api/me"
        );

      state.user =
        me.user;

      localStorage.setItem(
        "novaix_user",
        JSON.stringify(
          state.user
        )
      );

    }catch{

      clearAuth();

    }

  }

  updateNavigation();

  renderHome();

  setTimeout(
    () => {

      const loader =
        document.getElementById(
          "loader"
        );

      loader.style.opacity = "0";

      setTimeout(
        () => {
          loader.remove();
        },
        500
      );

    },
    500
  );

}

initialize();
